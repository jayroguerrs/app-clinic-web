<div class="modal-content">
    <!-- HEADER MODAL -->
    <div class="modal-header card-header">
      <h5 class="modal-title">ZONAS CORPORALES {{ tituloGenero }}</h5>
      <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cerrarModal()">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <!-- BODY MODAL-->
    <div class="modal-body card-body">
      <!-- Selección de zonas corporales con autocomplete -->
      <div class="form-row">
        <div class="form-group col-12">
          <app-autocomplete-select
            #autocompleteSelect
            [options]="zonasOptions"
            [config]="autocompleteConfig"
            (selectionChange)="onZonaSelected($event)"
            (optionRemoved)="onZonaRemoved($event)"
            (cleared)="onZonasCleared()">
          </app-autocomplete-select>

          
        </div>
      </div>

      <!-- Información de selecciones -->
      <div class="form-row" *ngIf="zonasSeleccionadas.length > 0">
        <div class="form-group col-md-6">
          <div class="clear-selection">Seleccionados ({{ zonasSeleccionadas.length }})</div>
        </div>
        <div class="form-group col-md-6">
          <div class="clear-selection text-right" 
               title="Click para limpiar selecciones" 
               (click)="eliminarSeleccionados()"
               style="cursor: pointer; color: #dc3545;">
            <i class="fa fa-times-circle"></i> Limpiar selecciones
          </div>
        </div>
      </div>

    </div>

    <!-- FOOTER MODAL-->
    <div class="modal-footer card-footer">
      <div class="form-row float-right">
        <button type="button" class="btn btn-outline-primary" (click)="aceptarCambios()"><i class="fa fa-save"></i>&nbsp;Aceptar</button>&nbsp;
      </div>
    </div>
  </div>
