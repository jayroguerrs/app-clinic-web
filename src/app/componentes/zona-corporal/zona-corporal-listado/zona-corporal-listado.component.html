<!-- SPINNER -->
<ngx-spinner
    [template]="rutaImageSpinner">
    <p style="color: white" > Cargando... </p>
</ngx-spinner>

<ng-template #modalZonaCorporalDatos let-modal let-close="close">
  <app-zona-corporal-datos
    (eventoZonaCorporalListar) = "zonaCorporalListar()"
    [maestroGeneros] = "maestroGeneros"
    [modal]="modalZonaCorporalDatosRef"
    [idZonaCorporal] = "idZonaCorporal"
    [maestroZonasCorporales] = "zonasCollection">
  </app-zona-corporal-datos>
</ng-template>

<ng-template #modalZonaAsignarSubZonas let-modal let-close="close">
  <app-zona-corporal-sub-zonas
    [modal]="modalZonaCorporalSubZonasRef"
    [zona] = "zonaCorporal">
  </app-zona-corporal-sub-zonas>
</ng-template>


<div class="row">
  <!-- FILTRO -->
  <div class="col-sm-12">
    <app-card cardTitle="LISTADO DE ZONAS CORPORALES" [options]="false" [hidBlock]="true">
    </app-card>
  </div>

  <!-- GRILLA -->
  <div class="col-sm-12">
    <app-card [options]="false" [customHeader]="true" [hidHeader]="true">

      <div class="table table-sm-responsive">
        <table datatable  [dtOptions]="dtResponsiveOptions"  class="table table-sm table-hover table-zona display compact"></table>
      </div>

    </app-card>
  </div>
</div>



<!-- BOTONERA ESCRITORIO -->
<ul class="botonera-escritorio">
  <li>
    <button type="button" class="btn btn-primary btn-icon" [placement]="'bottom'" ngbTooltip="Actualizar" (click)= "zonaCorporalListar()"><i class="mdi mdi-sync"></i></button>
    <button *ngIf="this.accTot || this.accCrud || this.accCreate" type="button" class="btn btn-primary btn-icon" [placement]="'bottom'" ngbTooltip="Nuevo" (click)= "zonaCorporalNuevo(modalZonaCorporalDatos)"><i class="mdi mdi-plus-circle-outline"></i></button>
    <button *ngIf="selected" type="button" class="btn btn-secondary btn-icon" [placement]="'bottom'" ngbTooltip="Asignar SubZonas" (click)="asignarSubZonas(modalZonaAsignarSubZonas)"><i class="mdi mdi-human"></i></button>
    <button *ngIf="selected" type="button" class="btn btn-secondary btn-icon" [placement]="'bottom'" ngbTooltip="Asignar Tratamientos" (click)="asignarTratamientos()"><i class="mdi mdi-human"></i></button>
    <button *ngIf="selected && (this.accTot || this.accCrud || this.accUpdate)" type="button" class="btn btn-warning btn-icon" [placement]="'bottom'" ngbTooltip="Editar" (click)= "zonaCorporalEditar(modalZonaCorporalDatos)" [disabled]="!idZonaCorporal"><i class="mdi mdi-square-edit-outline"></i></button>
    <button *ngIf="this.accTot || this.accExc" type="button" class="btn btn-secondary btn-icon" [placement]="'bottom'" ngbTooltip="Excel" (click)="exportarTabla()"><i class="mdi mdi-file-excel-outline"></i></button>
  </li>
</ul>


<!-- Menu Movil -->
<div class="float-menu">
  <button mat-fab color="primary" class="bg-primary" (click)="verOpciones()">
    <mat-icon>settings</mat-icon>
  </button>
</div>
<ng-template let-bottomSheetRef="bottomSheetRef" #menuMovil >
  <div class="_content" >
    <div class="_header">
      <div class="px-4 pt-4 text-center">
        <span class="d-inline-block topline"></span>
        <p class="text-center text-white _title lead">Opciones</p>
      </div>
      <mat-divider class=""></mat-divider>
    </div>

    <mat-nav-list class="pt-0">

      <div>
        <a mat-list-item (click)="zonaCorporalListar();cerrarOpciones();">
          <i class="mat-list-icon mdi mdi-sync"></i>
          <span class=" opt-title">Actualizar lista</span>
        </a>
        <mat-divider></mat-divider>
      </div>

      <div>
        <a mat-list-item (click)="zonaCorporalNuevo(modalZonaCorporalDatos);cerrarOpciones();">
          <i class="mat-list-icon mdi mdi-plus-circle-outline"></i>
          <span class=" opt-title">Agregar zona</span>
        </a>
        <mat-divider></mat-divider>
      </div>

      <div *ngIf="selected">
        <a mat-list-item (click)="zonaCorporalEditar(modalZonaCorporalDatos);cerrarOpciones();">
          <i class="mat-list-icon mdi mdi-square-edit-outline"></i>
          <span class=" opt-title">Editar zona</span>
        </a>
        <mat-divider></mat-divider>
      </div>

      <div *ngIf="selected">
        <a mat-list-item (click)="asignarSubZonas(modalZonaAsignarSubZonas);cerrarOpciones();">
          <i class="mat-list-icon mdi mdi-human"></i>
          <span class=" opt-title">Asignar sub zonas</span>
        </a>
        <mat-divider></mat-divider>
      </div>

      <div>
        <a mat-list-item (click)="exportarTabla();cerrarOpciones();">
          <i class="mat-list-icon mdi mdi-file-excel-outline"></i>
          <span class=" opt-title">Exportar excel</span>
        </a>
        <mat-divider></mat-divider>
      </div>

    </mat-nav-list>
  </div>
</ng-template>
