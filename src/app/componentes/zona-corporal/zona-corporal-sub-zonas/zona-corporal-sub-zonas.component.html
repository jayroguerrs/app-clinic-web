  <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
       <div class="modal-content">
          <div class="modal-header card-header">
              <h5 class="modal-title">Asignar sub zonas</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="modal.close()">
                  <span aria-hidden="true">&times;</span>
              </button>
          </div>

          <div class="modal-body card-body">
            <p class="text-muted">Zona Padre: <b>{{ zona?.descripcion }}</b></p>
            
            <!-- Chips para sub-zonas seleccionadas -->
            <mat-chip-set class="mb-3" *ngIf="subZonasSeleccionadas.length > 0">
              <mat-chip 
                *ngFor="let subZona of subZonasSeleccionadas" 
                (removed)="removerSubZona(subZona)"
                [removable]="true">
                {{ subZona.text }}
                <mat-icon matChipRemove>cancel</mat-icon>
              </mat-chip>
            </mat-chip-set>

            <!-- Campo de autocomplete -->
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Buscar y seleccionar sub-zonas...</mat-label>
              <input 
                type="text"
                matInput
                [formControl]="subZonaSearchControl"
                [matAutocomplete]="autoSubZonas"
                placeholder="Escriba para buscar sub-zonas...">
              <mat-autocomplete 
                #autoSubZonas="matAutocomplete"
                (optionSelected)="seleccionarSubZona($event)">
                <mat-option 
                  *ngFor="let zona of zonasFiltradasObservable | async" 
                  [value]="zona">
                  {{ zona.text }}
                </mat-option>
              </mat-autocomplete>
            </mat-form-field>
            
            <small class="text-muted">
              {{ subZonasSeleccionadas.length }} sub-zona(s) seleccionada(s)
            </small>
          </div>

          <div class="modal-footer card-footer">
              <div class="form-row float-right">
                  <button type="submit" class="btn btn-outline-primary"><i class="feather icon-save"></i>Guardar</button>
                  <button type="reset"  class="btn btn-outline-danger" (click)="cerrarModal()"><i class="feather icon-slash"></i>Cancelar</button>
              </div>
          </div>
      </div>
  </form>
