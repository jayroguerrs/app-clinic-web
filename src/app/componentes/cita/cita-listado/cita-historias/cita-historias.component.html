<div class="modal-content">
  <div class="modal-header card-header">
    <h5 class="modal-title">Historias clinicas</h5>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cerrarModal()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>

  <div class="modal-body card-body">

    <div class="card-block">
      <div class="table table-sm">
        <table id="datatable" datatable [dtOptions]="dtResponsiveOptions" class="table table-sm table-hover table-zona display compact"></table>
      </div>
    </div>

  </div>
  <div class="modal-footer card-footer">
    <div class="form-row float-right">
      <button type="button" class="btn btn-outline-danger" (click)="cerrarModal()">Cerrar</button>
    </div>
  </div>
</div>
