<div class="modal-content">
    <div class="modal-header card-header">
        <h5 class="modal-title">ZONAS APLICA DESCUENTO EXTRA</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cerrarModal()">
          <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div class="modal-body card-block p-0">

      <a class="zona-item d-flex"  [class.select]="selectZonas.includes(zona.idZona)" *ngFor="let zona of zonasCorporalesHabilitadas" (click)="select(zona.idZona)">
          <span class="cbx mr-2"></span><h6 class="mb-0">{{ zona.descripcion }}</h6>
      </a>

    </div>

    <div class="modal-footer card-footer text-right">
      <button type="submit" class="btn btn-outline-primary" (click)="cerrarModal()"><i class="mdi mdi-check"></i>Aceptar</button>
    </div>
</div>
