<form *ngIf="!editarZona">
    <div class="modal-header card-header">
        <h5 class="modal-title">SELECCIONAR ZONAS CORPORALES</h5>
        <button type="button" class="close basic-close" data-dismiss="modal" aria-label="Close"
            (click)="cerrarModal()"><span aria-hidden="true">&times;</span></button>
    </div>

    <div class="modal-body card-body">
        <div class="form-row">

            <div class="form-group col-6 col-xs-6 col-sm-3 col-md-4">
              <div class="input-group input-group-sm">
                <div class="input-group-append"><span class="input-group-text">Servicio</span></div>
                <div class="input-group-append"><span class="input-group-text">{{servicio}}</span></div>
              </div>
            </div>

            <div class="form-group col-6 col-xs-6 col-sm-3 col-md-4">
                <div class="input-group input-group-sm">
                    <div class="input-group-append"><span class="input-group-text">Duración</span></div>
                    <input type="text" class="form-control" [value]="zonahorarios.duracion" disabled>
                </div>
            </div>

            <div class="form-group col-6 col-xs-6 col-sm-9 col-md-4">
                <div class="input-group input-group-sm">
                    <div class="input-group-append"><span class="input-group-text">Intervalo</span></div>
                    <div class="input-group-append"><span class="input-group-text">de: {{datosCita.horaInicio | date: formatoHoraInicio}}  a: {{horaTermino  | date: formatoHoraInicio}}</span></div>
                </div>
            </div>

        </div>

        <div class="form-row">
            <div class="form-group col-md-12">
                <dual-list class="col-auto" [sort]="keepSorted" [source]="source" [key]="key" [display]="display" [filter]="filter" height="235px"
                          [(destination)]="confirmed"  [format]="format" [disabled]="disabled" (destinationChange)="confirmarZonaCorporal($event)">
                </dual-list>
            </div>
        </div>

    </div>
    <div class="modal-footer card-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cerrarModal()">Cerrar</button>
        <button type="button" class="btn btn-primary" (click)="confirmarZonasCorporales();">Confirmar Zonas</button>
    </div>
</form>



<form *ngIf="editarZona">
    <div style="background-color: rgb(43, 43, 43);" class="modal-header card-header">
        <h5 class="modal-title">EDITAR ZONA CORPORAL</h5>
        <button type="button" class="close basic-close" style="color: white;" data-dismiss="modal" aria-label="Close"
            (click)="cerrarModal()"><span aria-hidden="true">&times;</span></button>
    </div>

    <div class="modal-body card-body">

        <div class="form-row">
            <div class="form-group col-md-12">

                <dual-list class="col-auto" [sort]="keepSorted" [source]="source" [key]="key" [display]="display" [filter]="filter" height="235px"
                          [(destination)]="confirmed"  [format]="formatEdit" [disabled]="disabled" (destinationChange)="confirmarEditarZonaCorporal($event)">
                </dual-list>
            </div>
        </div>

    </div>
    <div class="modal-footer card-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cerrarModal()">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="editarZonaSeleccionada();">Editar Zona</button>
    </div>
</form>
