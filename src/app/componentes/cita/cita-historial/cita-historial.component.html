<form [formGroup]="frmCitaHistorial">
    <div class="modal-content">

        <div class="modal-header card-header">
            <h5 class="modal-title">Historial</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cerrarModal()"><span aria-hidden="true">&times;</span></button>
        </div>

        <div class="modal-body card-body">

            <div id="collapseOne" class=" card-body collapse show" aria-labelledby="headingOne" data-parent="#accordionExample">
                    <div class="card">
                        <div class="card-body">
                            <div class="table table-responsive">
                                <table id="responsive-table" class="display table dt-responsive nowrap w-100">
                                    <thead>
                                        <tr>
                                            <th>Fechas</th>
                                            <th>Usuario</th>
                                            <th>Descripción</th>
                                            <th>Detalle</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let historial of listaHistorialSeguimiento">
                                            <td><h6>{{ historial.fechaSeguimiento | date: 'dd-MM-yyyy hh:mm:ss a' }}</h6></td>
                                            <td><h6>{{ historial.usuario }}</h6></td>
                                            <td><h6>{{ historial.descripcion }}</h6></td>
                                            <td><h6>{{ historial.detalle  }}</h6></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
            </div>
        </div>
 </div>
</form>
