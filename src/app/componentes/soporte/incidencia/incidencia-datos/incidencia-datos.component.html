<!-- SPINNER -->
<ngx-spinner 
    [template]="rutaImageSpinner">
    <p style="color: white" > Cargando... </p>
</ngx-spinner>


<form [formGroup]="frmIncidencia">
    <div class="modal-content">
        <div class="modal-header card-header">
            <h5 class="modal-title">{{ accion }} Incidencia</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cerrarModal()">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
            <div class="modal-body card-body">
            
            <div class="form-row">
                <div class="form-group col-md-12">
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend">
                            <span class="input-group-text" for="idModulo">Módulo </span>
                        </div>
                        <input type="text" class="form-control dz-uppercase" formControlName="idModulo"/>
                        <div *ngIf="submitted && f.idModulo.errors" class="invalid-feedback">
                            <div *ngIf="f.idModulo.errors.required">Seleccione un módulo</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer card-footer">
            <div class="form-row float-right">
                <button type="button" class="btn btn-outline-primary" (click)="incidenciaGrabar()"><i class="feather icon-save"></i>Guardar</button>
                <button type="button"  class="btn btn-outline-danger" (click)="cerrarModal()"><i class="feather icon-slash"></i>Cancelar</button>
            </div>
        </div>

    </div> 
</form>
