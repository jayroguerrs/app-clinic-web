<!-- MODAL ANUNCIO DATOS -->
<ng-template #modalAnuncioDatos let-modal let-close="close">
  <app-anuncio-datos [id]="id" [modal]="modalAnuncioDatosRef"></app-anuncio-datos>
</ng-template>

<!-- MODAL PARA VER EL ANUNCIO -->
<ng-template #modalAnuncioVista let-modal let-close="close">
    <div class="modal-content">
       <div class="modal-header card-header">
           <h5 class="modal-title">{{ tituloVer }}</h5>
           <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="modal.close()"><span aria-hidden="true">&times;</span></button>
       </div>
       <div class="modal-body card-body">
           <div class="form-row">
               <div class="form-group col-md-12"><label>{{ informacionVer }}</label></div>
           </div>
           <div class="form-row">
               <div class="form-group col-md-12">
                   <div class="picture-container">
                     <div class="picture sizePictureAnuncio" name="imagen">
                       <img [src]="imagenVer" class="picture-src">
                     </div>
                   </div>
                 </div>
           </div>
       </div>
   </div>
</ng-template>



<!-- BOTONERA ESCRITORIO -->
<ul class="botonera-escritorio">
  <li>
    <button type="button" class="btn btn-primary btn-icon" [placement]="'bottom'" ngbTooltip="Actualizar" (click)= "anuncioListar()"><i class="fa fa-sync-alt"></i></button>
    <button *ngIf="this.accTot || this.accCrud || this.accCreate" type="button" class="btn btn-primary btn-icon" [placement]="'bottom'" ngbTooltip="Nuevo" (click)= "anuncioNuevo(modalAnuncioDatos)"><i class="fa fa-plus-circle"></i></button>
  </li>
</ul>
<!-- BOTONERA MOVIL -->
<a class="botonera-movil"><i class="fa fa-cog"></i></a>
<ul class="ul-botonera-movil">
  <li (click)= "anuncioListar()"><a><i class="fa fa-sync-alt"></i></a></li>
  <li (click)= "anuncioNuevo(modalAnuncioDatos)"><a><i class="fa fa-plus-circle"></i></a></li>
</ul>


<div class="col-sm-12">
  <app-card [options]="false" cardTitle="LISTADO DE ANUNCIOS" [hidBlock]="true">

  </app-card>
</div>



<!-- GALERIA DE ANUNCIOS -->
<div class="col-sm-12">
  <app-card [options]="false" cardTitle="LISTADO DE ANUNCIOS" [hidHeader]="true">

    <div class="grid">
      <figure class="effect-julia" *ngFor="let anuncio of anuncios" (click)="verAnuncio(modalAnuncioVista, anuncio)">
          <!-- <button style="position: fixed; float: right; z-index: 1000;" id="btnEditar" type="button" class="btn btn-primary btn-icon" [placement]="'bottom'" ngbTooltip="Editar" (click)= "anuncioEditar(modalAnuncioDatos)">
            <i class="mdi mdi-square-edit-outline"></i>
          </button> -->
        <img [src]= "anuncio.imagen"/>
        <figcaption>
          <h1 class="sombra">{{ anuncio.titulo }}</h1>
          <p>{{ anuncio.informacion.substring(0, 40) }}...</p>
        </figcaption>
      </figure>
    </div>

  </app-card>
</div>
