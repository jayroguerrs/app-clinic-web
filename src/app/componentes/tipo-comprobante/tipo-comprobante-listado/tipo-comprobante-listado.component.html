<!-- MODAL TIPO COMPROBANTE DATOS -->
<ng-template #modalTipoComprobanteDatos let-modal let-close="close">
  <app-tipo-comprobante-datos
      (eventoTipoComprobanteListar)="tipoComprobanteListar()"
      [idTipoComprobante] = "idTipoComprobante"
      [modal]="modalTipoComprobanteDatosRef">
  </app-tipo-comprobante-datos>
</ng-template>

<!-- BARRA TITULO -->
<div class="row">
  <div class="col-sm-12">
    <app-card [options]="false" [hidBlock]="true" cardTitle="TIPO DE COMPROBANTE">
    </app-card>
  </div>
</div>


<div class="row">
  <!-- GRILLA -->
  <div class="col-sm-12">
    <app-card [options]="false" [hidHeader]="true">

      <div class="table table-sm-responsive">
        <table datatable [dtOptions]="dtResponsiveOptions" class="table table-sm table-hover table-tipoComprobante display compact">
        </table>
      </div>

    </app-card>
  </div>

</div>

<!-- BOTONERA ESCRITORIO -->
<ul class="botonera-escritorio">
  <li>
    <button type="button" class="btn btn-primary btn-icon" [placement]="'bottom'" ngbTooltip="Listar" (click)= "tipoComprobanteListar()"><i class="mdi mdi-sync"></i></button>
    <button *ngIf="this.accTot || this.accCrud || this.accCreate" type="button" class="btn btn-primary btn-icon" [placement]="'bottom'" ngbTooltip="Nuevo" (click)= "tipoComprobanteNuevo(modalTipoComprobanteDatos)"><i class="mdi mdi-plus-circle-outline"></i></button>
    <button *ngIf="selected && (this.accTot || this.accCrud || this.accUpdate)" type="button" class="btn btn-warning btn-icon" [placement]="'bottom'" ngbTooltip="Editar" (click)= "tipoComprobanteEditar(modalTipoComprobanteDatos)"><i class="mdi mdi-square-edit-outline"></i></button>
    <button *ngIf="this.accTot || this.accExc" type="button" class="btn btn-secondary btn-icon" [placement]="'bottom'" ngbTooltip="Excel" (click)="exportarTabla()"><i class="mdi mdi-file-excel-outline"></i>    </button>
  </li>
</ul>


<!-- Menu Movil -->
<div class="float-menu">
  <button mat-fab color="primary" class="bg-primary" (click)="verOpciones()">
    <mat-icon>settings</mat-icon>
  </button>
</div>
<ng-template let-bottomSheetRef="bottomSheetRef" #menuMovil >
  <div class="_content" >
    <div class="_header">
      <div class="px-4 pt-4 text-center">
        <span class="d-inline-block topline"></span>
        <p class="text-center text-white _title lead">Opciones</p>
      </div>
      <mat-divider class=""></mat-divider>
    </div>

    <mat-nav-list class="pt-0">
      <div>
        <a mat-list-item (click)= "tipoComprobanteListar();cerrarOpciones();">
          <i class="mat-list-icon mdi mdi-sync"></i>
          <span class=" opt-title">Listar</span>
        </a>
        <mat-divider></mat-divider>
      </div>
      <div>
        <a mat-list-item (click)= "tipoComprobanteNuevo(modalTipoComprobanteDatos);cerrarOpciones();">
          <i class="mat-list-icon mdi mdi-plus-circle-outline"></i>
          <span class=" opt-title">Nuevo</span>
        </a>
        <mat-divider></mat-divider>
      </div>
      <div *ngIf="selected">
        <a mat-list-item (click)= "tipoComprobanteEditar(modalTipoComprobanteDatos);cerrarOpciones();">
          <i class="mat-list-icon mdi mdi-square-edit-outline"></i>
          <span class=" opt-title">Editar</span>
        </a>
        <mat-divider></mat-divider>
      </div>
      <div>
        <a mat-list-item (click)= "exportarTabla();cerrarOpciones();">
          <i class="mat-list-icon mdi mdi-file-excel-outline"></i>
          <span class=" opt-title">Exportar excel</span>
        </a>
        <mat-divider></mat-divider>
      </div>

    </mat-nav-list>
  </div>
</ng-template>
