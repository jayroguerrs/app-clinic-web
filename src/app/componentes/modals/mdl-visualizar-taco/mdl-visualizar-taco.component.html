<div class="scard bg-transparent popins">
    <div class="modal-header card-header bg-gradient">
      <h5 class="card-title text-white f-w-500 m-0">Previsualización</h5>
      <button type="button" class="btn sbtn btn-sm btn-icon btn-active-color-primary h-auto w-auto p-0" (click)="cerrarModal(false)">
              <span class="svg-icon svg-icon-1 text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                  <rect opacity="0.5" x="6" y="17.3137" width="16" height="2" rx="1" transform="rotate(-45 6 17.3137)" fill="currentColor"></rect>
                  <rect x="7.41422" y="6" width="16" height="2" rx="1" transform="rotate(45 7.41422 6)" fill="currentColor"></rect>
                </svg>
              </span>
      </button>
    </div>
    <div class="card-body bg-white p-1">

      <iframe *ngIf="urlData" [ngClass]="{'iframe-oculto': mostrarPdfViewer}" #iframe [src]="urlData" frameborder="0" (load)="iframeLoad(iframe)" width="100%"  height="500" class="d-block" scrolling="yes" allowfullscreen="true" ></iframe>
      <pdf-viewer #pdfviewer
        *ngIf="mostrarPdfViewer"
        [src]="urlVisualizar"
        [render-text]="true"
        [original-size]="false"
        style="width: 100%; height: 500px;"
      ></pdf-viewer>

    </div>
    <div class="modal-footer bg-white py-3">
      <div class="form-row float-right">
        <button matRipple type="reset" class="btn sbtn btn-light mr-2" (click)="cerrarModal(false)">Cancelar</button>
        <button matRipple type="submit" class="btn sbtn btn-primary shadow btn-shadow-primary" (click)="imprimir()" >Imprimir</button>
      </div>
    </div>

</div>
