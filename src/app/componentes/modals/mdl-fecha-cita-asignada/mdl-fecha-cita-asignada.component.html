
<form [formGroup]="frmGroup" (ngSubmit)="onSubmit()">
    <div class="modal-content">
        <div class="modal-header card-header">
            <h5 class="modal-title">Editar Fecha de llamada</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cerrarModal()">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body card-body">
            <div class="form-group">

                <div class="form-floating">
                  <input type="date" maxlength="50" class="form-control dz-uppercase" id="maqDescripcion" placeholder=" " formControlName="fecha" [ngClass]="{ 'is-invalid': submitted && f.fecha.errors }" >
                  <label for="maqDescripcion">Fecha de llamada <span class="text-danger">*</span></label>
                </div>
                <div *ngIf="submitted && f.fecha.errors" class="invalid-feedback d-block">
                  <div *ngIf="f.fecha.errors.required">Ingrese la nueva fehca</div>
                </div>
            </div>
        </div>
        <div class="modal-footer card-footer">
            <div class="form-row float-right">
                <button type="submit" class="btn btn-outline-primary"><i
                        class="feather icon-save"></i>Guardar</button>
                <button type="reset" class="btn btn-outline-danger" (click)="cerrarModal()"><i
                        class="feather icon-slash"></i>Cancelar</button>
            </div>
        </div>

    </div>
</form>
