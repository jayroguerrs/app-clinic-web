<div class="modal-header card-header bg-gradient border-bottom-0">
  <h2 class="d-flex align-middle">
    <div class="my-auto mr-3">
        <fontawesome-svg icon="clock-rotate-left" [width]="22" [height]="22" type="duotone" class="text-white"></fontawesome-svg>
    </div>
    <div class="my-auto">
      <h2 class="mb-0 fs-18px f-w-500 text-white" >Historial</h2>
    </div>
  </h2>
  <button class="btn sbtn btn-sm btn-icon btn-active-color-primary h-auto w-auto p-0" (click)="modal.close(false)">
    <span class="svg-icon svg-icon-1 text-white">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <rect opacity="0.5" x="6" y="17.3137" width="16" height="2" rx="1" transform="rotate(-45 6 17.3137)" fill="currentColor"></rect>
        <rect x="7.41422" y="6" width="16" height="2" rx="1" transform="rotate(45 7.41422 6)" fill="currentColor"></rect>
      </svg>
    </span>
  </button>
</div>

<div class="modal-body card-body p-4">
  <div class="d-flex flex-column h-100 overflow-auto">
    <ng-container [ngSwitch]="ldCollection">
      <div *ngSwitchCase="true">
        <div *ngFor="let i of utilsService.counter(5)" class="sk block h-100px w-100" [class.mb-3]="i < 5"></div>
      </div>
      <div *ngSwitchCase="false">
         <div *ngFor="let m of collection; let i = index" class="item d-flex flex-row align-items-center p-3 bg-hover-light" [ngClass]="{'border-bottom border-bottom-dashed': i < (collection.length-1)}" >
           <!--<div class="mr-3">
             <fontawesome-svg icon="clock-rotate-left" [width]="16" [height]="16" type="light" class="text-muted"></fontawesome-svg>
           </div>-->
           <div class="d-flex flex-column">
             <p class="text-dark fs-15px f-w-500 mb-2">{{ i > 0 ? 'Reasignación' : 'Asignación' }}</p>
             <span class="fs-12px mb-1">Asignado Por: <span>{{ m.asignadoPor }}</span> | {{ utilsService.firstLetterUpperCase( m.fechaRegistro | date: 'MMMM d, y  h:mm:ss a': '' : 'es-PE') }}</span>
             <span class="fs-12px">Asignado A: <span>{{ m.asignadoA }}</span></span>
           </div>
         </div>
       </div>
    </ng-container>
  </div>
</div>

<div class="modal-footer">
  <button type="reset" class="btn sbtn btn-light mr-2" (click)="cerrarModal()">Cerrar</button>
</div>
