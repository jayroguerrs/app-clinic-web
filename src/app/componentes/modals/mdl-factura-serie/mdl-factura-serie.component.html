<form [formGroup]="frmGroup" (ngSubmit)="onSubmit()" class="popins">
  <div class="scard bg-transparent popins">
    <div class="modal-header card-header bg-gradient">
      <h5 class="card-title text-white f-w-500 m-0">{{ data ? 'Editar' : 'Nueva' }} Serie de Facturación</h5>
      <button type="button" class="btn sbtn btn-sm btn-icon btn-active-color-primary h-auto w-auto p-0" (click)="cerrarModal(false)">
              <span class="svg-icon svg-icon-1 text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                  <rect opacity="0.5" x="6" y="17.3137" width="16" height="2" rx="1" transform="rotate(-45 6 17.3137)" fill="currentColor"></rect>
                  <rect x="7.41422" y="6" width="16" height="2" rx="1" transform="rotate(45 7.41422 6)" fill="currentColor"></rect>
                </svg>
              </span>
      </button>
    </div>
    <div class="card-body bg-white p-5">
        <div class="form-group">
          <label for="serie" class="fw-semibold text-gray-800 mb-0">Serie de Facturación</label>
          <input type="text" maxlength="200" class="form-control form-control-solid dz-uppercase" id="serie" placeholder="Ingresar la serie" formControlName="serie" [ngClass]="{ 'is-invalid bg-color-light-danger': submitted && f.serie.errors }" >
          <div *ngIf="submitted && f.serie.errors" class="invalid-feedback d-block">
            <div *ngIf="f.serie.errors.required">Ingrese la serie de facturación</div>
          </div>
        </div>

        <div class="form-group">
          <label class="fw-semibold text-gray-800 mb-0">Sede</label>
          <select class="form-select form-select-solid" id="idSede" formControlName="idSede" [ngClass]="{ 'is-invalid bg-color-light-danger': submitted && f.idSede.errors }">
            <option value="">--Seleccionar--</option>
            <option *ngFor="let s of sedes" [value]="s.id">{{ s.nombre }}</option>
          </select>
          <div *ngIf="submitted && f.idSede.errors" class="invalid-feedback d-block">
            <div *ngIf="f.idSede.errors.required">Seleccione la sede</div>
          </div>
        </div>

        <div class="form-group mb-0">
          <label class="fw-semibold text-gray-800 mb-0">Estado</label>
          <select class="form-select form-select-solid" id="idEstado" formControlName="idEstado">
            <option *ngFor="let est of estados" [value]="est.id">{{ est.value }}</option>
          </select>
        </div>

    </div>
    <div class="modal-footer bg-white py-3">
      <div class="form-row float-right">
        <button matRipple [disabled]="loading" type="reset" class="btn sbtn btn-light mr-2" (click)="cerrarModal(false)">Cancelar</button>
        <button matRipple type="submit" class="btn sbtn btn-primary shadow btn-shadow-primary" >Guardar</button>
      </div>
    </div>

    </div>
</form>
