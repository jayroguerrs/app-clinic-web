<form [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <div class="modal-content">
      <div class="modal-header card-header">
        <h5 class="modal-title">Preferente Ventas</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="closeModal(false)">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body card-body">
        <div class="form-row">
          <div class="col-12 col-md-6 col-lg-5 mb-3">
            <label class="fw-semibold text-gray-800 required mb-0">Fecha Desde</label>
            <div class="position-relative">
              <fontawesome-svg class="position-absolute ps-13px pt-2 no-pointer-events" icon="calendar-day" type="light-alt" [width]="24" [height]="24"></fontawesome-svg>
              <input
                type="text"
                mwlFlatpickr
                [altInput]="true"
                [convertModelValue]="true"
                [maxDate]="today"
                [altFormat]="'d/m/Y'"
                dateFormat="Y-m-d"
                class="form-control form-control-solid form-control-sm ps-48px"
                placeholder="dd/mm/yyyy"
                formControlName="fechaDesde"
                readonly
              />
            </div>
          </div>
          <div class="col-12 col-md-6 col-lg-5 mb-3">
            <label class="fw-semibold text-gray-800 required mb-0">Fecha Hasta</label>
            <div class="position-relative">
              <fontawesome-svg class="position-absolute ps-13px pt-2 no-pointer-events" icon="calendar-day" type="light-alt" [width]="24" [height]="24"></fontawesome-svg>
              <input
                type="text"
                mwlFlatpickr
                [altInput]="true"
                [convertModelValue]="true"
                [maxDate]="today"
                [altFormat]="'d/m/Y'"
                dateFormat="Y-m-d"
                class="form-control form-control-solid form-control-sm ps-48px"
                placeholder="dd/mm/yyyy"
                formControlName="fechaHasta"
                readonly
              />
            </div>

          </div>
        </div>
      </div>
      <div class="modal-footer card-footer">
        <div class="form-row float-right">
          <button type="submit" class="btn btn-outline-primary" [disabled]="formGroup.invalid"><i class="feather icon-send"></i>Enviar</button>
          <button type="reset" class="btn btn-outline-danger" (click)="closeModal()"><i class="feather icon-slash"></i>Cancelar</button>
        </div>
      </div>
    </div>
  </form>
