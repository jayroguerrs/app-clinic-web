
<form [formGroup]="formGroup" (ngSubmit)="evtOnSubmit()" class="popins mh-100">
  <div class="scard bg-transparent popins mh-100">
        <div class="modal-header card-header bg-gradient">
            <h5 class="card-title text-white f-w-500 m-0">Sunat - Anular Comprobante Electrónico</h5>
            <button type="button" class="btn sbtn btn-sm btn-icon btn-active-color-primary h-auto w-auto p-0" (click)="cerrarModal(false)">
              <span class="svg-icon svg-icon-1 text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                  <rect opacity="0.5" x="6" y="17.3137" width="16" height="2" rx="1" transform="rotate(-45 6 17.3137)" fill="currentColor"></rect>
                  <rect x="7.41422" y="6" width="16" height="2" rx="1" transform="rotate(45 7.41422 6)" fill="currentColor"></rect>
                </svg>
              </span>
            </button>
        </div>
        <div class="card-body bg-white p-0 depilform position-relative d-flex flex-column">

          <loader-circle *ngIf="loading | async"></loader-circle>

          <div class="h-100 mh-100 p-4" [ngClass]="{'overflow-auto': (loading | async) === false, 'overflow-hidden': (loading | async) === true}">

              <div class="w-100">
                <label for="motivo" class="form-label mb-0 text-secondary f-w-500">Motivo</label>
                <div class="position-relative">
                  <textarea id="motivo" placeholder="Ingrese el motivo de la anulación" formControlName="motivo" class="form-indigo form-control form-indigo form-control-sm pe-35px h-100px" [ngClass]="{'bg-color-light-danger border-danger' : submitted && f.motivo.errors}"></textarea>
                </div>
              </div>

          </div>

        </div>
        <div class="modal-footer bg-white py-3">
            <div class="form-row float-right">
              <button matRipple type="reset" class="btn sbtn btn-light mr-2" (click)="cerrarModal()">Cancelar</button>
              <button matRipple type="submit" class="btn sbtn btn-primary shadow btn-shadow-primary" >Anular</button>
            </div>
        </div>

    </div>
</form>
