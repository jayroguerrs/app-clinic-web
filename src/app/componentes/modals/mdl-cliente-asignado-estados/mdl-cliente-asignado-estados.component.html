<div class="modal-header card-header bg-gradient border-bottom-0">
  <h2 class="d-flex align-middle">
    <div class="my-auto">
      <h2 class="mb-0 fs-18px f-w-500 text-white" >Estado cliente</h2>
    </div>
  </h2>
  <button class="btn sbtn btn-sm btn-icon btn-active-color-primary h-auto w-auto p-0" (click)="modal.close(false)">
    <span class="svg-icon svg-icon-1 text-white">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <rect opacity="0.5" x="6" y="17.3137" width="16" height="2" rx="1" transform="rotate(-45 6 17.3137)" fill="currentColor"></rect>
        <rect x="7.41422" y="6" width="16" height="2" rx="1" transform="rotate(45 7.41422 6)" fill="currentColor"></rect>
      </svg>
    </span>
  </button>
</div>

<div class="modal-body card-body p-4">
  <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

  <ng-container *ngFor="let e of collection; let i = index">
    <div matRipple class="estados fs-20px py-3 px-3 text-center rounded-15px text-center" (click)="evtSelect(e)" [class.selected]="isSelect(e)">{{ e.estado }}</div>
  </ng-container>

</div>
<div class="modal-footer text-center">
  <button [disabled]="!selected" matRipple class="btn btn-indigo" (click)="evtSubmit()">Seleccionar</button>
</div>
