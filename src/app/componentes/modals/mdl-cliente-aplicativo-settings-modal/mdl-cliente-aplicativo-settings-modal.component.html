<div class="modal-header card-header bg-gradient border-bottom-0">
  <h2 class="d-flex align-middle">
    <div class="my-auto mr-3">
        <!-- <fontawesome-svg icon="clock-rotate-left" [width]="22" [height]="22" type="duotone" class="text-white"></fontawesome-svg> -->
    </div>
    <div class="my-auto">
      <h2 class="mb-0 fs-18px f-w-500 text-white" >Opciones</h2>
    </div>
  </h2>
  <button class="btn sbtn btn-sm btn-icon btn-active-color-primary h-auto w-auto p-0" (click)="modal.close(false)" >
    <span class="svg-icon svg-icon-1 text-white">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <rect opacity="0.5" x="6" y="17.3137" width="16" height="2" rx="1" transform="rotate(-45 6 17.3137)" fill="currentColor"></rect>
        <rect x="7.41422" y="6" width="16" height="2" rx="1" transform="rotate(45 7.41422 6)" fill="currentColor"></rect>
      </svg>
    </span>
  </button>
</div>

<div class="modal-body card-body p-4">
  <div class="d-flex flex-column h-100">
    <ng-container>
      <div>
        <!-- <div class="sk block h-100px w-100" >
            
        </div> -->
        <div>
         <div (click)="cambiarEstadoCita(6)" class="item d-flex flex-row align-items-center p-3 bg-hover-light position-relative border rounded-15px mb-2 cr-pointer" >

           <ng-container>

             <div class="d-flex flex-column">

               <table class="table-sm">
                 <tr class="fs-16px">
                   <td class="text-gray-800"  >Atendido</td>
                 </tr>
               </table>

             </div>
           </ng-container>
         </div>

        <div  (click)="cambiarEstadoCita(5)" class="item d-flex flex-row align-items-center p-3 bg-hover-light position-relative border rounded-15px mb-2 cr-pointer"  >
           <ng-container>
             <div class="d-flex flex-column">
               <table class="table-sm">
                 <tr class="fs-16px">
                   <td class="text-gray-800" >Cancelar</td>
                 </tr>
               </table>
             </div>
           </ng-container>
        </div>

        <div class="item d-flex flex-row align-items-center p-3 bg-hover-light position-relative border rounded-15px mb-2 cr-pointer"  >
           <ng-container>
             <div class="d-flex flex-column">
               <table class="table-sm">
                 <tr class="fs-16px">
                   <!-- <td class="text-gray-800">Registrar Cliente</td> -->
                   <td class="text-gray-800">Agendar Cita</td>
                 </tr>
               </table>
             </div>
           </ng-container>
        </div>

        <div class="item d-flex flex-row align-items-center p-3 bg-hover-light position-relative border rounded-15px mb-2 cr-pointer"  >
           <ng-container> 
             <div class="d-flex flex-column">
               <table class="table-sm">
                 <tr class="fs-16px">
                   <td class="text-gray-800">Marcar como Pagado</td>
                 </tr>
               </table>
             </div>
           </ng-container>
        </div>


       </div>
      </div>
    </ng-container>
  </div>
</div>
