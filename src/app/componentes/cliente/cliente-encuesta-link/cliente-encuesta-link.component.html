<div class="modal-content">
  <div class="modal-header card-header">
    <h5 class="modal-title">Encuesta Link</h5>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cerrarModal()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>

  <div class="modal-body card-body">

    <div class="mb-3">
      <div class="form-floating">
        <select  id="formulario" class="custom-select form-control" [formControl]="formulario" (change)="seleccionarFormulario()" >
          <option [value]="0">--Seleccionar--</option>
          <option *ngFor="let formulario of formularios" [value]="formulario.id">{{ formulario.nombre }}</option>
        </select>
        <label for="formulario">Encuesta</label>
      </div>
    </div>

    <div class="form-floating mb-3">

      <select class="custom-select form-control" id="idSede" [formControl]="idSede">
        <option [value]="0">--Seleccionar--</option>
        <option *ngFor="let sede of sedes" [value]="sede.id">{{ sede.nombre }}</option>
      </select>
      <label for="idSede">Seleccionar Sede</label>
    </div>

    <div class="form-floating mb-3">

      <input id="fecha" class="form-control" type="date" [formControl]="fecha" (change)="seleccionarFormulario()">
      <label for="fecha">Fecha</label>
    </div>

    <div class="form-floating">
      <textarea id="resultado" class="form-control" [formControl]="resultado" placeholder="" row="5"></textarea>
      <label for="resultado">Resultado</label>
    </div>


  </div>

  <div class="modal-footer card-footer">
    <div class="form-row float-right">
      <button type="submit" class="btn btn-outline-primary" (click)="onSubmit()"><i class="feather icon-share-2"></i>Enviar</button>
      <button type="reset" class="btn btn-outline-danger" (click)="cerrarModal()"><i class="feather icon-slash"></i>Cancelar</button>
    </div>
  </div>
</div>
