<div class="modal-content">
  <div class="modal-header card-header">
    <h5 class="modal-title">Encuesta</h5>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cerrarModal()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>

  <div class="modal-body card-body">


    <div class="form-group">
      <div *ngIf="buscarFormularios" class="alert alert-info rounded" role="alert">
        <span *ngIf="loadingRealizados"><b>Buscando encuestas anteriores ...</b></span>
        <span *ngIf="!loadingRealizados && buscarFormularios">
          <span *ngIf="formularioRealizados.length"><b><i class='feather icon-check-circle'></i> Encuesta realizadas:</b></span>
          <ul *ngIf="formularioRealizados.length" class="mb-0">
            <li *ngFor="let form of formularioRealizados; let i = index">{{ form.fechaRegistro | date: 'dd-MM-yyyy' }} <b matRipple (click)="verFormularioRealizado(form.id, form.fechaRegistro)" class="btn btn-sm" title="Ver"><i class="feather icon-eye m-0 border"></i></b></li>
          </ul>
          <span *ngIf="!formularioRealizados.length">No se realizaron encuestas anteriores</span>
        </span>
      </div>
    </div>

    <div class="form-floating mb-3">
      <select class="custom-select form-control" id="idFormulario" (change)="mostrarFormulario($event)">
        <option [value]="0">--Seleccionar--</option>
        <option *ngFor="let formulario of formularios" [value]="formulario.id" >{{ formulario.nombre }}</option>
      </select>
      <label for="idFormulario">Seleccionar formulario</label>
    </div>

    <div class="form-floating mb-3">
      <select class="custom-select form-control" id="idSede" [formControl]="idSede">
        <option [value]="0">--Seleccionar--</option>
        <option *ngFor="let sede of sedes" [value]="sede.id">{{ sede.nombre }}</option>
      </select>
      <label for="idSede">Seleccionar Sede</label>
    </div>


    <div *ngIf="formulario" class="mt-3">
      <div *ngFor="let pregunta of formulario.preguntas; let i = index" class="mb-3 border rounded p-3">
        <h6 class="mb-3">{{(i+1)}}. {{ pregunta.texto }}</h6>


        <div *ngIf="pregunta.tipoRespuesta === 'select'">

          <div *ngIf="pregunta.multiple">
            <app-autocomplete-select
              [options]="getMultiPleData(pregunta.opciones, pregunta.multiple)"
              [config]="{
                multiple: pregunta.multiple,
                useChips: pregunta.multiple,
                placeholder: '--Seleccionar--',
                searchable: true,
                clearable: true,
                emptyMessage: 'No hay opciones disponibles'
              }"
              (selectionChange)="onEncuestaSelectionChanged($event, pregunta, pregunta.opciones)">
            </app-autocomplete-select>
          </div>

        </div>

        <ul *ngIf="pregunta.tipoRespuesta === 'radio' || pregunta.tipoRespuesta === 'checkbox' || pregunta.tipoRespuesta === 'textarea' " class="pl-0 no-list mb-0">
          <li *ngFor="let opcion of pregunta.opciones">


            <div  *ngIf="pregunta.tipoRespuesta === 'radio'" class="radio radio-primary d-inline" (change)="toggleAdicional(pregunta.id,opcion)">
              <input type="radio" [name]="'pre'+pregunta.id" [id]="'pre'+opcion.id" [value]="opcion.id">
              <label [for]="'pre'+opcion.id" class="cr">{{ opcion.valor }}</label>
            </div>

            <div *ngIf="pregunta.tipoRespuesta === 'checkbox'" class="checkbox checkbox-primary d-inline">
              <input type="checkbox" [name]="'pre'+opcion.id" [id]="'pre'+opcion.id" [value]="opcion.id">
              <label [for]="'pre'+opcion.id" class="cr">{{ opcion.valor }}</label>
            </div>

            <div *ngIf="pregunta.tipoRespuesta === 'textarea'" (change)="insertText(pregunta.id,$event)">
              <textarea class="form-control"></textarea>
            </div>

            <div *ngIf="opcion.adicional && mostrarAdicional(pregunta.id,opcion.id)" class="mb-3" >
              <input type="text" class="form-control" (change)="insertAdicional(pregunta.id,$event)" [placeholder]="opcion.placeholderAdicional ? opcion.placeholderAdicional : ''">
            </div>

          </li>
        </ul>
      </div>
    </div>

  </div>

  <div class="modal-footer card-footer">
    <div class="form-row float-right">
      <button type="submit" class="btn btn-outline-primary" (click)="onSubmit()"><i class="feather icon-save"></i>Guardar</button>
      <button type="reset" class="btn btn-outline-danger" (click)="cerrarModal()"><i class="feather icon-slash"></i>Cancelar</button>
    </div>
  </div>
</div>
