<div class="modal-content">
  <div class="modal-header card-header">
    <h5 class="modal-title">Encuesta</h5>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cerrarModal()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>

  <div class="modal-body card-body">
      <h2 class="text-center h6 font-weight-bold mb-3">Fecha de la encuesta: {{ fecha | date: 'dd-MM-yyyy' }}</h2>

      <div *ngFor="let pregunta of formularioPreguntas; let i = index" class="border rounded p-2 mb-3">
        <p class="font-weight-bold">{{i+1}}. {{ pregunta.texto }}</p>
        <ul>
          <b>Resp:</b>
          <ng-template ngFor let-item [ngForOf]="pregunta.opciones">
            <li *ngIf="item.contador === 1 && (pregunta.tipoRespuesta === 'select' || pregunta.tipoRespuesta === 'checkbox' || pregunta.tipoRespuesta === 'radio')">{{ item.valor }}</li>
          </ng-template>
          <li *ngIf="pregunta.tipoRespuesta === 'textarea'">{{ pregunta.respuesta}}</li>
        </ul>
      </div>

  </div>

  <div class="modal-footer card-footer">
    <div class="form-row float-right">
      <button type="reset" class="btn btn-outline-danger" (click)="cerrarModal()"><i class="feather icon-slash"></i>Cerrar</button>
    </div>
  </div>
</div>
