<!-- SPINNER -->
<ngx-spinner
    [template]="rutaImageSpinner">
    <p style="color: white" > Cargando... </p>
</ngx-spinner>

<!-- MODAL TIPO CITA DATOS -->
<ng-template #modalTipoCitaDatos let-modal let-close="close">
  <app-tipo-cita-datos
    [idTipoCita]="idTipoCita"
    [modal]="modalTipoCitaDatosRef"
    (eventCitaTipoListar)="tipoCitaListar()"
    ></app-tipo-cita-datos>
</ng-template>

<div id="hidden-btn" style="visibility: hidden"></div>

<div class="row">
  <div class="col-sm-12">
    <app-card [options]="false" cardTitle="TIPO DE CITAS" [hidBlock]="true">

      <!-- <form  [formGroup]="frmFiltroGrilla">
        <div class="form-row">
          <div class="form-group col-md-auto">
            <div class="input-group input-group-sm">
                <div class="input-group-prepend"><span class="input-group-text">Tipo de cita </span></div>
                <input type="text" class="form-control" formControlName="filterTipoCita" aria-label="Default" aria-describedby="inputGroup-sizing-default">
            </div>
          </div>
        </div>
      </form> -->
    </app-card>
  </div>

  <div class="col-sm-12">
    <app-card [options]="false" [customHeader]="true" [hidHeader]="true">

      <div class="table table-sm-responsive">
        <table datatable [dtOptions]="dtResponsiveOptions" class="table table-sm table-hover table-zona display compact"></table>
      </div>
    </app-card>
  </div>
</div>


<!-- BOTONERA ESCRITORIO -->
<ul class="botonera-escritorio">
  <li>
    <button type="button" class="btn btn-primary btn-icon"    [placement]="'bottom'" ngbTooltip="Listar" (click)= "tipoCitaListar()"><i class="mdi mdi-sync"></i></button>
    <button *ngIf="this.accTot || this.accCrud ||this.accCreate" type="button" class="btn btn-primary btn-icon"    [placement]="'bottom'" ngbTooltip="Nuevo" (click)= "nuevoTipoCitaDatos(modalTipoCitaDatos)"><i class="mdi mdi-plus-circle-outline"></i></button>
    <button *ngIf="selected && (this.accTot || this.accCrud ||this.accUpdate)" type="button" class="btn btn-warning btn-icon"  [placement]="'bottom'" ngbTooltip="Editar" (click)= "editarTipoCitaDatos(modalTipoCitaDatos)" id="btnEditar"><i class="mdi mdi-square-edit-outline"></i></button>
    <button *ngIf="this.accTot || this.accExc" type="button" class="btn btn-secondary btn-icon"    [placement]="'bottom'" ngbTooltip="Excel" (click)="exportarTabla()"><i class="mdi mdi-file-excel-outline"></i></button>
  </li>
</ul>

<!-- Menu Movil -->
<div class="float-menu">
  <button mat-fab color="primary" class="bg-primary" (click)="verOpciones()">
    <mat-icon>settings</mat-icon>
  </button>
</div>
<ng-template let-bottomSheetRef="bottomSheetRef" #menuMovil >
  <div class="_content" >
    <div class="_header">
      <div class="px-4 pt-4 text-center">
        <span class="d-inline-block topline"></span>
        <p class="text-center text-white _title lead">Opciones</p>
      </div>
      <mat-divider class=""></mat-divider>
    </div>

    <mat-nav-list class="pt-0">

      <div>
        <a mat-list-item (click)= "tipoCitaListar();cerrarOpciones();">
          <i class="mat-list-icon mdi mdi-sync"></i>
          <span class=" opt-title">Actualizar lista</span>
        </a>
        <mat-divider></mat-divider>
      </div>

      <div>
        <a mat-list-item (click)="nuevoTipoCitaDatos(modalTipoCitaDatos);cerrarOpciones();">
          <i class="mat-list-icon mdi mdi-plus-circle-outline"></i>
          <span class=" opt-title">Nuevo</span>
        </a>
        <mat-divider></mat-divider>
      </div>

      <div *ngIf="selected">
        <a mat-list-item (click)="editarTipoCitaDatos(modalTipoCitaDatos);cerrarOpciones();">
          <i class="mat-list-icon mdi mdi-square-edit-outline"></i>
          <span class=" opt-title">Editar</span>
        </a>
        <mat-divider></mat-divider>
      </div>

      <div>
        <a mat-list-item (click)="exportarTabla();cerrarOpciones();">
          <i class="mat-list-icon mdi mdi-file-excel-outline"></i>
          <span class=" opt-title">Exportar excel</span>
        </a>
      </div>

    </mat-nav-list>
  </div>
</ng-template>
