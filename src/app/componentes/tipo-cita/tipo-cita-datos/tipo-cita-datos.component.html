<!-- SPINNER -->
<ngx-spinner
    [template]="rutaImageSpinner">
    <p style="color: white" > Cargando... </p>
</ngx-spinner>

<form [formGroup]="frmTipoCitaDatos">
    <div class="modal-header card-header">
        <h5 class="modal-title">Datos de tipo de cita</h5>
        <button type="button" class="close basic-close" data-dismiss="modal" aria-label="Close"
            (click)="cerrarModal()"><span aria-hidden="true">&times;</span></button>
    </div>

    <div class="modal-body card-body">

        <div class="form-row">
            <div class="form-group col-12">
                <div class="form-floating">
                  <input maxlength="20" type="text" class="form-control dz-uppercase" id="nombre" placeholder=" " formControlName="nombre" [ngClass]="{ 'is-invalid': submitted && f.nombre.errors }" >
                  <label for="nombre">Nombre <span class="text-danger">*</span></label>
                </div>
                <div *ngIf="submitted && f.nombre.errors" class="invalid-feedback d-block">
                  <div *ngIf="f.nombre.errors.required">Ingrese un nombre</div>
                </div>
            </div>

            <div class="form-group col-12">
              <div class="form-floating">
                <select class="custom-select" id="idEstado" formControlName="idEstado" [ngClass]="{ 'is-invalid': submitted && f.idEstado.errors }">
                  <option select value="1">ACTIVO</option>
                  <option select value="2">INACTIVO</option>
                </select>
                <label for="idEstado">Estado</label>
              </div>
              <div *ngIf="submitted && f.idEstado.errors" class="invalid-feedback d-block">
                <div *ngIf="f.idEstado.errors.required">Seleccione un estado</div>
              </div>
            </div>
        </div>

    </div>

    <div class="modal-footer card-footer">
        <button type="button" class="btn btn-primary" (click)="tipoCitaGrabar()" >Guardar</button>
        <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cerrarModal()">Cerrar</button>
    </div>
</form>
