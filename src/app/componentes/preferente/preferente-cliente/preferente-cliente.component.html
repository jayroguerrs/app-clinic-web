<form [formGroup]="frmPreferenteCliente">

        <div class="modal-header card-header">
            <h5 class="modal-title">Buscar cliente</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close"
            (click)="cerrarModal()"><span aria-hidden="true">&times;</span></button>
        </div>

        <div class="modal-body card-body">

            <form [formGroup]="frmFiltroGrilla">
              <div class="form-row">
                <div class="form-group col-md-auto">
                  <div class="form-floating">
                    <input type="text" class="form-control search" id="filterCliente" placeholder=" " formControlName="filterCliente" (keypress)="clienteListar($event)">
                    <label for="filterCliente">Cliente o Celular</label>
                  </div>
                  <span *ngIf="buscado">Se encontrarón {{ numClientes }} cliente(s)</span>
                </div>
              </div>
            </form>

              <div class="table table-sm-responsive">
                  <table id="tablaPreferenteCliente" datatable [dtOptions]="optionsDtPreferentes"
                  class="table table-sm table-hover display compact"></table>
              </div>

        </div>

        <div class="modal-footer card-footer">
            <div class="form-row float-right">
                <button type="button" class="btn btn-outline-primary" (click)="clientePreferenteGrabar()"><i class="feather icon-save"></i><span #spnGrabar>Seleccionar</span></button>
            </div>
        </div>
    </form>
