<div class="d-flex flex-column">
  <div class="p-2">
    <div #scroll [class]="'historial cita-avisos min-h-'+MaxHeight+'px max-h-'+MaxHeight+'px overflow-auto p-2'">
      <div *ngFor="let h of collection; let i = index" class="d-flex">
        <div>
          <span class="d-flex w-40px h-40px rounded-circle bg-indigo mr-1"><span class="text-white f-w-500 m-auto">{{utilService.shortName(h.usuarioRegistro)}}</span></span>
        </div>
        <div class="d-flex flex-column">
          <span class="bg-light-indigo text-indigo p-2 rounded d-block">{{h.texto}}</span>
          <span class="small fs-10px text-muted mt-1">{{ h.fechaRegistra | date: 'dd-MM-yyyy hh:mm' }}
            <button *ngIf="h.borrar" matRipple class="btn sbtn btn-light-danger btn-hover-danger btn-sm p-1 fs-10px" (click)="remove(i)" title="Eliminar">
              <fontawesome-svg icon="trash-can" [height]="10" [width]="10" type="regular" ></fontawesome-svg>
            </button>
          </span>
        </div>
      </div>
    </div>
  </div>

  <div class="chat-group">
    <div class="bg-light p-2">
      <form class="d-flex w-100" [formGroup]="frmGroup" (ngSubmit)="add()">
        <input class="form-control form-control-sm form-control-solid bg-white f-w-light" formControlName="mensaje" placeholder="Escribe un mensaje aquí" type="text">
        <button type="submit" class="btn btn-sm sbtn bgmutd text-secondary">
          <fontawesome-svg icon="paper-plane-top" type="solid" width="24" height="24"></fontawesome-svg>
        </button>
      </form>
    </div>
  </div>
</div>
