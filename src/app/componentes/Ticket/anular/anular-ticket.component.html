<div class="modal-content">
    <div class="modal-header card-header">
        <h5 class="modal-title">Anular Ticket</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cerrarModal()">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

   <div class="modal-body card-body">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12 text-center" >
                    <p class="lead">¿Esta Seguro en Anular el Ticket?</p>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-footer card-footer">
        <div class="form-row float-right">
            <button type="button" (click)="anularTicket()"  class="btn btn-primary"><i class="material-icons"></i><span>Si</span></button>
            <button type="button" (click)="cerrarModal()"    class="btn btn-danger" ><i class="feather icon-slash"></i>No</button>
        </div>
    </div>

</div>
