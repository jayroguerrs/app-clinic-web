<div class="modal-header">
  <h4 class="modal-title">{{ usuario }} - CITAS:</h4>
  <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="onClose()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <table datatable [dtOptions]="dtResponsiveOptions" class="table table-sm table-hover table-caja display compact"></table>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-outline-dark" (click)="onClose()">Cerrar</button>
</div>
