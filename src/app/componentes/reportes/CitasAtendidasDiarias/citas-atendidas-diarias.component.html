<!-- SPINNER -->
<ngx-spinner
  [template]="rutaImageSpinner">
  <p style="color: white" > Cargando... </p>
</ngx-spinner>


<!-- GRILLA -->
<div class="row">

  <div class="col-12 mb-3 sticky-header" stickyClass="header--sticky">
    <app-card [options]="false" [customHeader]="false" cardTitle="REPORTE DE CITAS ATENDIDAS DIARIAS" cardTitle2="">

      <form [formGroup]="formGroup">
        <div class="form-row">

          <!-- Fecha desde -->
          <div class="col-12 col-lg-3 mb-3">
            <div class="form-floating form-start-icon">
              <input id="fecha" type="date" placeholder=" " class="form-control" formControlName="fecha"  [ngClass]="{ 'is-invalid': submitted && f.fecha.errors }" >
              <label for="fecha">Fecha</label>
              <span class="icon"><span class="dicon calendar m-auto"></span></span>
            </div>
          </div>


          <!-- Sede -->
          <div class="col-12 col-lg-3 mb-3">
            <div class="form-floating form-start-icon">
              <select class="custom-select" id="idSede" formControlName="idSede" >
                <option value="0">{{ loadingSede ? 'Cargando...' : 'Todos' }}</option>
                <option *ngFor="let sede of collectionSede" [value]="sede.id">{{ sede.nombre }}</option>
              </select>
              <label for="idSede">Sede</label>
              <span class="icon">
                <span class="dicon sede m-auto"></span>
              </span>
            </div>
          </div>

          <!-- Servicio -->
          <div class="col-12 col-lg-3 mb-3">
            <div class="form-floating form-start-icon">
              <select class="custom-select" id="idServicio" formControlName="idServicio" >
                <option [value]="0">{{ ldServicios ? 'Cargando...' : 'Todos' }}</option>
                <option *ngFor="let s of servicios" [value]="s.id">{{ s.nombre }}</option>
              </select>
              <label for="idServicio">Servicio</label>
              <span class="icon">
                <span class="dicon sede m-auto"></span>
              </span>
            </div>
          </div>


        </div>
      </form>

    </app-card>
  </div>

  <div class="col-12">
    <app-card [options]="false" [customHeader]="false" cardTitle="CRONOGRAMA" >
      <tbl-reporte-citas-adendidas-diarias #tabla [idSede]="f.idSede.value" [fecha]="f.fecha.value" [idServicio]="f.idServicio.value"></tbl-reporte-citas-adendidas-diarias>
    </app-card>
  </div>

</div>


<!-- BOTONERA ESCRITORIO -->
<ul class="botonera-escritorio">
  <li>
    <button type="button" class="btn btn-primary btn-icon"   [placement]="'bottom'" ngbTooltip="Buscar" (click)= "obtenerReporte()"><i class="mdi mdi-magnify"></i></button>
    <button *ngIf="this.accTot || this.accExc" type="button" class="btn btn-secondary btn-icon" [disabled]="!hasValues"   [placement]="'bottom'" ngbTooltip="Exportar" (click)= "exportar()"><i class="mdi mdi-file-excel-outline"></i></button>
  </li>
</ul>

<!-- BOTONERA MOVIL -->
<app-float-button>
  <button class="child" mat-fab color="primary"  matTooltip="Buscar" matTooltipPosition="left" (click)="obtenerReporte()">
    <mat-icon>search</mat-icon>
  </button>
  <button class="child" mat-fab color="primary" [disabled]="!collectionData.length"  matTooltip="Exportar" matTooltipPosition="left" (click)="exportar()">
    <mat-icon>file_download</mat-icon>
  </button>
</app-float-button>
