<form [formGroup]="frmCajaApertura">
    <div class="modal-content">
        <div class="modal-header card-header">
            <h5 class="modal-title">Apertura de Caja</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cerrarModal()">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>

        <div class="modal-body card-body">
            <div class="form-row">

                <div class="form-group col-md-12">
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend">
                            <span class="input-group-text w-100" for="descripcion">Caja</span>
                        </div>
                        <input type="text" class="form-control dz-uppercase" formControlName="descripcion" disabled/>

                    </div>
                </div>

                <div class="form-group col-md-12">
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend">
                            <span class="input-group-text w-100" for="fechaApertura">Fecha apertura</span>
                        </div>
                        <input type="date" class="form-control dz-uppercase" formControlName="fechaApertura" disabled/>

                    </div>
                </div>

                <div class="form-group col-md-12">
                  <div class="input-group input-group-sm">
                    <div class="input-group-prepend">
                      <span class="input-group-text w-100" for="fechaApertura">Turno</span>
                    </div>
                    <select class="custom-select dz-uppercase" formControlName="turno">
                        <option *ngFor="let t of turnos" [value]="t.id">{{ t.nombre }}</option>
                    </select>
                  </div>
                </div>

                <div class="form-group col-md-12">
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend">
                            <span class="input-group-text" for="saldoInicial">Saldo inicial</span>
                        </div>
                        <input type="text" class="form-control dz-uppercase"
                                currencyMask [options]="options" style="text-align:right;"
                                formControlName="saldoInicial"/>

                    </div>
                </div>
            </div>
        </div>

        <div class="modal-footer card-footer">
            <div class="form-row float-right">
                <button type="button" class="btn btn-outline-primary" (click)="cajaApertura()"><i class="feather icon-save"></i>Guardar</button>
                <button type="button"  class="btn btn-outline-danger" (click)="cerrarModal()"><i class="feather icon-slash"></i>Cancelar</button>
            </div>
        </div>

    </div>
</form>
