<!-- SPINNER -->
<ngx-spinner 
    [template]="rutaImageSpinner">
    <p style="color: white" > Cargando... </p>
</ngx-spinner>

<!-- FORMULARIO -->
<form [formGroup]="frmCajaCuadre">
    <div class="modal-content">
        <div class="modal-header card-header">
            <h5 class="modal-title">Cuadre diario de caja</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cerrarModal()">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>

        <div class="modal-body card-body">
            <div class="form-row">

                <div class="form-group col-md-12">
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend"><span class="input-group-text" for="fechaCuadre">Fecha </span></div>
                        <input type="date" class="form-control" formControlName="fechaCuadre" aria-span="Default" aria-describedby="inputGroup-sizing-default"  (change)="consultarTotales()">
                    </div>
                </div>

                <div class="form-group col-md-12">
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend"><span class="input-group-text" for="sedeCuadre">Sede </span></div>
                        <input type="text" class="form-control dz-uppercase" formControlName="sedeCuadre" disabled/>
                    </div>
                </div>

                <div class="form-group col-md-12">
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend"><span class="input-group-text" for="cajaCuadre">Caja </span></div>
                        <input type="text" class="form-control dz-uppercase" formControlName="cajaCuadre" disabled/>
                    </div>
                </div>
            </div>

            <hr>
            <h6>RESUMEN DEL DIA </h6>

            <div class="form-row">

                <div class="form-group col-md-12">
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend"><span class="input-group-text" for="totalIngreso">INGRESO VENTA </span></div>
                        <input type="text" 
                        currencyMask [options]="options"
                        class="form-control dz-uppercase" formControlName="totalIngreso" disabled/>
                    </div>
                </div>

                <div class="form-group col-md-12">
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend"><span class="input-group-text" for="totalSaldoInicial">SALDO INICIAL </span></div>
                        <input type="text" 
                        currencyMask [options]="options"
                        class="form-control dz-uppercase" formControlName="totalSaldoInicial" disabled/>
                    </div>
                </div>

                <div class="form-group col-md-12">
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend"><span class="input-group-text" for="totalGastoDia">GASTO DEL DIA </span></div>
                        <input type="text" 
                        currencyMask [options]="options"
                        class="form-control dz-uppercase" formControlName="totalGastoDia" disabled/>
                    </div>
                </div>

                <div class="form-group col-md-12">
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend"><span class="input-group-text" for="total">TOTAL EFECTIVO </span></div>
                        <input type="text" 
                        currencyMask [options]="options"
                        class="form-control dz-uppercase" formControlName="total" disabled/>
                    </div>
                </div>

                <div class="form-group col-md-12">
                    <div class="input-group input-group-sm">
                        <div class="input-group-prepend"><span class="input-group-text" for="usuario">USUARIO</span></div>
                        <input type="text" class="form-control dz-uppercase" formControlName="usuario" disabled/>
                    </div>
                </div>

            </div>
            
        </div>

        <div class="modal-footer card-footer">
            <div class="form-row float-right">
                <button type="button" class="btn btn-outline-primary" (click)="imprimirCuadre()"><i class="feather icon-save"></i>Imprimir</button>
                <button type="button"  class="btn btn-outline-danger" (click)="cerrarModal()"><i class="feather icon-slash"></i>Cancelar</button>
            </div>
        </div>
    </div> 
</form>
