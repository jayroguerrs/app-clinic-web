<!-- SPINNER -->
<ngx-spinner [template]="rutaImageSpinner">
    <p style="color: white"> Cargando... </p>
</ngx-spinner>


<form [formGroup]="frmMaquinaDatos">
    <div class="modal-content">
        <div class="modal-header card-header">
            <h5 class="modal-title">{{ accion }} Maquina</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cerrarModal()">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body card-body">
              <div class="form-group">
                  <div class="form-floating">
                    <input type="text" maxlength="20" class="form-control dz-uppercase" id="maqDescripcion" placeholder=" " formControlName="maqDescripcion" [ngClass]="{ 'is-invalid': submitted && f.maqDescripcion.errors }" >
                    <label for="maqDescripcion">Descripción <span class="text-danger">*</span></label>
                  </div>
                  <div *ngIf="submitted && f.maqDescripcion.errors" class="invalid-feedback d-block">
                    <div *ngIf="f.maqDescripcion.errors.required">Ingrese descripción de la máquina</div>
                    <div *ngIf="f.maqDescripcion.errors.maxLength">La descripción debe tener un máximo de 20 letras</div>
                  </div>
              </div>

              <div class="form-group">
                <div class="form-floating">
                  <input type="text" class="form-control focus color" id="color" formControlName="color" [(colorPicker)]="color" [style.background]="color" [cpOKButton]="true" [cpOKButtonText]="'Aceptar'" [cpOKButtonClass]="'btn btn-sm btn-primary'"  [cpCancelButton]="true" [cpCancelButtonText]="'Cancelar'" [cpCancelButtonClass]="'btn btn-sm btn-secondary'" (colorPickerChange)="onChangeColor($event)"  placeholder=" " [ngClass]="{ 'is-invalid': submitted && f.color.errors }" >
                  <label for="color">Color <span class="text-danger">*</span></label>
                </div>
                <div *ngIf="submitted && f.color.errors" class="invalid-feedback d-block">
                  <div *ngIf="f.color.errors.required">Seleccione un color para el servicio</div>
                </div>
              </div>

              <div class="form-group mb-0">
                  <div class="form-floating">
                    <select class="form-select" #maqIdEstado id="maqIdEstado" formControlName="maqIdEstado">
                      <option value="1">ACTIVO</option>
                      <option value="0">INACTIVO</option>
                    </select>
                    <label for="maqIdEstado">Estado</label>
                  </div>
              </div>
        </div>
        <div class="modal-footer card-footer">
            <div class="form-row float-right">
                <button type="button" class="btn btn-outline-primary" (click)="maquinaGrabar()"><i
                        class="feather icon-save"></i>Guardar</button>
                <button type="button" class="btn btn-outline-danger" (click)="cerrarModal()"><i
                        class="feather icon-slash"></i>Cancelar</button>
            </div>
        </div>

    </div>
</form>
