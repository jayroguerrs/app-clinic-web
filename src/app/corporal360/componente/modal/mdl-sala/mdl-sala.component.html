
<form [formGroup]="frmGroup" (ngSubmit)="onSubmit()">
    <div class="modal-content">
        <div class="modal-header card-header">
            <h5 class="modal-title">{{ data ? 'Editar' : 'Nueva' }} Sala</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cerrarModal()">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body card-body">
              <div class="form-group">
                  <div class="form-floating">
                    <input type="text" maxlength="50" class="form-control dz-uppercase" id="nombre" placeholder=" " formControlName="nombre" [ngClass]="{ 'is-invalid': submitted && f.nombre.errors }" >
                    <label for="nombre">Nombre <span class="text-danger">*</span></label>
                  </div>
                  <div *ngIf="submitted && f.nombre.errors" class="invalid-feedback d-block">
                    <div *ngIf="f.nombre.errors.required">Ingrese nombre del box</div>
                  </div>
              </div>
              <div class="form-group">
                <div class="form-floating">
                  <select class="custom-select" id="idSede" formControlName="idSede" [ngClass]="{ 'is-invalid': submitted && f.idSede.errors }">
                    <option value="">--Seleccionar--</option>
                    <option *ngFor="let s of sedes" [value]="s.id">{{ s.nombre }}</option>
                  </select>
                  <label for="idSede">Sede <span class="text-danger">*</span></label>
                </div>
                <div *ngIf="submitted && f.idSede.errors" class="invalid-feedback d-block">
                  <div *ngIf="f.idSede.errors.required">Seleccione la sede</div>
                </div>
              </div>
              <div class="form-group">
                <label>Servicios <span class="text-danger">*</span></label>
                <select class="form-control" formControlName="servicios" multiple [ngClass]="{ 'is-invalid': submitted && f.servicios.errors }">
                  <option *ngFor="let servicio of servicios" [value]="servicio.id">{{ servicio.text }}</option>
                </select>
                <div *ngIf="submitted && f.servicios.errors" class="invalid-feedback d-block">
                  <div *ngIf="f.servicios.errors.required">Seleccione al menos un servicio</div>
                </div>
              </div>
              <div class="form-group mb-0">
                  <div class="form-floating">
                    <select class="form-select" id="idEstado" formControlName="idEstado">
                      <option *ngFor="let est of estados" [value]="est.id">{{ est.value }}</option>
                    </select>
                    <label for="idEstado">Estado</label>
                  </div>
              </div>
        </div>
        <div class="modal-footer card-footer">
            <div class="form-row float-right">
                <button type="submit" class="btn btn-outline-primary"><i
                        class="feather icon-save"></i>Guardar</button>
                <button type="reset" class="btn btn-outline-danger" (click)="cerrarModal()"><i
                        class="feather icon-slash"></i>Cancelar</button>
            </div>
        </div>

    </div>
</form>
