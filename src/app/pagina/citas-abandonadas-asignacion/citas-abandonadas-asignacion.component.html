<!-- SPINNER -->
<ngx-spinner
    [template]="rutaImageSpinner">
    <p style="color: white" > Cargando... </p>
</ngx-spinner>


<!-- BOTONERA ESCRITORIO -->
<ul class="botonera-escritorio">
  <li>
    <button id="btnListar1" type="button" class="btn btn-primary btn-icon" [placement]="'bottom'" ngbTooltip="Actualizar"    (click)="asignacionListar()">                   <i class="mdi mdi-sync"></i></button>
    <button id="btnAsignacion1" type="button" class="btn btn-primary btn-icon" [placement]="'bottom'" ngbTooltip="Asignación"    (click)="irAsignacion( false)" ><i class="mdi mdi-account-question-outline"></i></button>
    <button *ngIf="mostrarReasignacion" type="button" class="btn btn-primary btn-icon" [placement]="'bottom'" ngbTooltip="Re-asignación" (click)="irAsignacion( true)" ><i class="mdi mdi-account-plus-outline"></i></button>
    <button type="button" class="btn btn-warning btn-icon" [placement]="'bottom'" ngbTooltip="Asignación Citas En Espera"    (click)="irAsignacionEnEspera( false)" ><i class="mdi mdi-account-question-outline"></i></button>
  </li>
</ul>

<!-- Menu Movil -->
<div class="float-menu">
  <button mat-fab color="primary" class="bg-primary" (click)="verOpciones()">
    <mat-icon>settings</mat-icon>
  </button>
</div>
<ng-template let-bottomSheetRef="bottomSheetRef" #menuMovil >
  <div class="_content" >
    <div class="_header">
      <div class="px-4 pt-4 text-center">
        <span class="d-inline-block topline"></span>
        <p class="text-center text-white _title lead">Opciones</p>
      </div>
      <mat-divider class=""></mat-divider>
    </div>

    <mat-nav-list class="pt-0">
      <a mat-list-item (click)= "asignacionListar();cerrarOpciones();">
        <i class="mat-list-icon mdi mdi-sync"></i>
        <span class=" opt-title">Actualizar</span>
      </a>
      <mat-divider></mat-divider>
      <a mat-list-item (click)="irAsignacion(modalAsignacion, false);cerrarOpciones();">
        <i class="mat-list-icon mdi mdi-account-question-outline"></i>
        <span class=" opt-title">Asignación</span>
      </a>
      <mat-divider></mat-divider>
      <div>
        <a mat-list-item (click)="irAsignacion(modalAsignacion, true);cerrarOpciones();">
          <i class="mat-list-icon mdi mdi-account-plus-outline"></i>
          <span class=" opt-title">Re-asignación</span>
        </a>
        <mat-divider></mat-divider>
      </div>

    </mat-nav-list>
  </div>
</ng-template>




<div class="row">
  <!-- FILTRO -->
  <div class="col-sm-12">
    <app-card [options]="false" cardTitle="ASIGNACIÓN DE CITAS ABANDONADAS">
      <form  [formGroup]="frmFiltro">

        <div class="form-row">

<!--          <div class="form-group col-xs-6 col-sm-6 col-md-6 col-lg-2">-->
<!--            <div class="form-floating form-start-icon">-->
<!--              <select class="custom-select" id="tipoCliente" formControlName="tipoCliente" (change)="citaListar()">-->
<!--                <option [value]="2" >...TODOS...</option>-->
<!--                <option [value]="1" >Cliente Nuevo</option>-->
<!--                <option [value]="0" >Cliente Antiguo</option>-->
<!--              </select>-->
<!--              <label for="tipoCliente">Tipo Cliente</label>-->
<!--              <span class="icon"><i class="mdi mdi-account-question-outline"></i></span>-->
<!--            </div>-->
<!--          </div>-->


          <div class="form-group col-xs-6 col-sm-6 col-md-6 col-lg-2">
            <div class="form-floating form-start-icon">
              <input id="filtroFecha" type="date" placeholder=" " class="form-control" formControlName="filtroFecha" (change)="citaListar()" >
              <label for="filtroFecha">Fecha confirmación</label>
              <span class="icon"><i class="mdi mdi-calendar"></i></span>
            </div>
          </div>

          <div class="form-group col-xs-6 col-sm-6 col-md-6 col-lg-2">
            <div class="form-floating form-start-icon">
              <select class="custom-select" id="asignadoA" name="asignadoA" formControlName="asignadoA" (change)="citaListar()">
                <option *ngFor="let usuario of dataUsuarios" [value]="usuario.id">{{usuario.text}}</option>
              </select>
              <label for="asignadoA">Asignado a</label>
              <span class="icon"><i class="mdi mdi-account-question-outline"></i></span>
            </div>
          </div>

          <div class="form-group col-xs-6 col-sm-6 col-md-6 col-lg-2">
            <div class="form-floating form-start-icon">
              <select class="custom-select" id="asignadoPor" name="asignadoPor" formControlName="asignadoPor" (change)="citaListar()">
                <option *ngFor="let usuario of dataUsuarios" [value]="usuario.id">{{usuario.text}}</option>
              </select>
              <label for="asignadoPor">Asignado por</label>
              <span class="icon"><i class="mdi mdi-account-check-outline"></i></span>
            </div>
          </div>
        </div>
      </form>
    </app-card>
  </div>

  <!-- GRILLA RESUMEN-->
  <div class="form-group col-md-12">
    <div class="form-row">

      <div class="form-group col-md-9">
        <table class="resumen center">
          <caption>RESUMEN DE CITAS</caption>
          <tbody>
          <tr>
            <td>Sin Confirmar</td><td>Reprogramada</td>
          </tr>
          <tr>
            <td>{{ sinConfirmar }}</td><td>{{ reprogramada }}</td>
          </tr>
          <tr>
            <td>Cancelada</td><td>Anulada</td>
          </tr>
          <tr>
            <td>{{ cancelada }}</td><td>{{ anulada}}</td>
          </tr>
          </tbody>
        </table>
      </div>

      <div class="form-group col-md-3">
        <table class="resumen avance">
          <caption>RESUMEN AVANCE</caption>
          <tbody>
          <tr>
            <td>Pendiente</td><td>{{ asigPendiente }}</td>
          </tr>
          <tr>
            <td>Visto</td><td>{{ asigVisto }}</td>
          </tr>
          <tr>
            <td>Trabajado</td><td>{{ asigTrabajado }}</td>
          </tr>
          <tr>
            <td>Total</td><td>{{ asigTotal }}</td>
          </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <!-- GRILLA LISTADO-->
  <div class="form-group col-md-12">
    <div class="table table-sm-responsive"><table datatable [dtOptions]="dtResponsiveOptions" class="table table-sm table-hover table-citasAsignadas display compact"></table></div>
  </div>
</div>
