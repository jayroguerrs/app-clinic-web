<!-- SPINNER -->
<ngx-spinner
  [template]="rutaImageSpinner">
  <p style="color: white" > Cargando... </p>
</ngx-spinner>


<div class="row">
  <div class="col-12">
    <div class="scard mb-0 mb-xl-10 popins">
      <div class="card-header">
        <div class="card-title m-0">
          <h3 class="fw-bold m-0">Eventos</h3>
        </div>
      </div>
      <div class="card-body p-4">
          <div  class="d-flex flex-wrap align-items-start">
            <div class="flex-grow-1">
              <div class="fs-16px fw-bold mb-1 text-dark d-flex align-items-center">
                <mat-icon class="me-2 text-danger">logout</mat-icon>
                Cierre de sesión
              </div>
              <p class="text-gray-600 fs-12px mb-0">Cierra la sesión de varios o un usuario, de manera remota</p>
            </div>
            <div class="ml-auto">
              <form [formGroup]="frmGroup1" (ngSubmit)="cerrarSesion()">
                <div class="form-group mb-3" style="max-width: 500px;">
                  <app-autocomplete-select
                    [options]="usuarioOptions"
                    [config]="usuarioAutocompleteConfig"
                    [formControl]="usuarioControl1"
                    (selectionChange)="onUsuario1Selected($event)">
                  </app-autocomplete-select>
                </div>
                <div class="d-flex align-items-center gap-2">
                  <button mat-raised-button color="warn" type="submit" [disabled]="!usuarioSeleccionado1">
                    <mat-icon class="me-2">logout</mat-icon>
                    Cerrar Sesión
                  </button>
                  <span *ngIf="usuarioSeleccionado1" class="text-muted small">
                    Para: <strong>{{ usuarioSeleccionado1.text }}</strong>
                  </span>
                </div>
              </form>
            </div>
          </div>

          <div class="separator separator-dashed my-4"></div>

          <div  class="d-flex flex-wrap align-items-start">
            <div class="flex-grow-1">
              <div class="fs-16px fw-bold mb-1 text-dark d-flex align-items-center">
                <mat-icon class="me-2 text-primary">refresh</mat-icon>
                Actualizar sistema
              </div>
              <p class="text-gray-600 fs-12px mb-0">Recargar los datos del sistema de varios o un usuario, de manera remota</p>
            </div>
            <div class="ml-auto">
              <form [formGroup]="frmGroup2" (ngSubmit)="actualizarSistema()">
                <div class="form-group mb-3" style="max-width: 500px;">
                  <app-autocomplete-select
                    [options]="usuarioOptions"
                    [config]="usuarioAutocompleteConfig"
                    [formControl]="usuarioControl2"
                    (selectionChange)="onUsuario2Selected($event)">
                  </app-autocomplete-select>
                </div>
                <div class="d-flex align-items-center gap-2">
                  <button mat-raised-button color="primary" type="submit" [disabled]="!usuarioSeleccionado2">
                    <mat-icon class="me-2">refresh</mat-icon>
                    Actualizar Sistema
                  </button>
                  <span *ngIf="usuarioSeleccionado2" class="text-muted small">
                    Para: <strong>{{ usuarioSeleccionado2.text }}</strong>
                  </span>
                </div>
              </form>
            </div>
          </div>

      </div>
    </div>
  </div>
</div>
