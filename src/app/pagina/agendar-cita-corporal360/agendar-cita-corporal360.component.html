<form [formGroup]="frmGroup">

  <div class="row">
    <div class="col-12">
      <div class="scard mb-5 mb-xl-10 popins">
        <div class="card-header">
          <div class="card-title m-0">
            <h3 class="fw-bold m-0">Datos Generales</h3>
          </div>
        </div>
        <div class="card-body">
          <div class="form-row">
            <div class="col-12 col-lg-3">
              <div class="form-group popins">
                <label class="fw-semibold text-gray-800 mb-1">Cliente </label>
                <input type="text" formControlName="cliente" class="form-control form-control-solid" readonly>
              </div>
            </div>
            <div class="col-12 col-lg-3">
              <div class="form-group popins">
                <label class="fw-semibold text-gray-800 mb-1">N° de Documento </label>
                <input type="text" formControlName="documento" class="form-control form-control-solid" readonly>
              </div>
            </div>
            <div class="col-12 col-lg-3">
              <div class="form-group popins">
                <label class="fw-semibold text-gray-800 mb-1">N° de Celular</label>
                <input type="text" formControlName="telefono" class="form-control form-control-solid" readonly>
              </div>
            </div>
            <div class="col-12 col-lg-3">
              <div class="form-group popins">
                <label class="fw-semibold text-gray-800 mb-1">Sede de cita</label>
                <select formControlName="idSede" class="form-select form-select-solid">
                  <option value="">--Seleccionar--</option>
                  <option *ngFor="let s of sedes" [value]="s.idSede">{{s.nombre}}</option>
                </select>
              </div>
            </div>

                <div class="position-relative">

            <div class="col-12 col-lg-3">
              <div class="form-group popins">
                <label class="fw-semibold text-gray-800 mb-1">Tipo de Cliente</label>
                <select formControlName="idTipoCliente" class="form-select form-select-solid">
                  <option value="">--Seleccionar--</option>
                  <option *ngFor="let t of tiposCliente" [value]="t.idTipoCliente">{{t.tipoCliente}}</option>
                </select>
              </div>
            </div>
            <div class="col-12 col-lg-3">
              <div class="form-group popins">
                <label class="fw-semibold text-gray-800 mb-1">Tipo de Cita</label>
                <select formControlName="idTipoCita" class="form-select form-select-solid">
                  <option value="">--Seleccionar--</option>
                  <option *ngFor="let t of tiposCita" [value]="t.idTipoCita">{{t.nombre}}</option>
                </select>
              </div>
            </div>
            <div class="col-12 col-lg-3">
              <div class="form-group popins">
                <label class="fw-semibold text-gray-800 mb-1">Tipo de Servicio</label>
                <input type="hidden" class="form-control form-control-solid">
                <input type="text" class="form-control form-control-solid" readonly>
              </div>
            </div>
            <div class="col-12 col-lg-3">
              <div class="form-group popins">
                <label class="fw-semibold text-gray-800 mb-1">Tecnología</label>
                <select formControlName="idTecnologia" class="form-select form-select-solid">
                  <option value="">--Seleccionar--</option>
                  <option *ngFor="let t of tecnologias" [value]="t.id">{{t.nombre}}</option>
                </select>
              </div>
            </div>
            <div class="col-12 col-lg-3">
              <div class="form-group popins">
                <label class="fw-semibold text-gray-800 mb-1">Zona</label>
                <input type="hidden" class="form-control form-control-solid" >
                <input type="text" class="form-control form-control-solid" readonly>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12">
      <app-card [options]="false" [hidHeader]="true">

      </app-card>
    </div>
  </div>


</form>
