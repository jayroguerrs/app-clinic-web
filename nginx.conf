server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security Headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' data: https: wss:; frame-src 'self' blob: data:; child-src 'self' blob: data:; object-src 'none';" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Denegar métodos HTTP peligrosos
  if ($request_method !~ ^(GET|POST|PUT|PATCH|HEAD)$ ) {
    return 405;
  }

  # Denegar acceso a archivos de backup
  location ~ \.bak$ {
    deny all;
    return 404;
  }

  location ~ /backup-files {
    deny all;
    return 404;
  }

  # Denegar acceso a archivos PHP (por si acaso)
  location ~ \.php$ {
    deny all;
    return 404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Archivos estáticos con cache fuerte
  location ~* \.(?:css|js|woff2?|ttf|eot|png|jpg|jpeg|gif|svg)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
  }
}
